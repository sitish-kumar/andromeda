name: Update Portal Input

on:
  repository_dispatch:
    types: [xdg-desktop-portal-umbriel-updated]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-portal-input
  cancel-in-progress: false

jobs:
  update:
    if: >-
      ${{
        github.repository == 'noctalia-dev/umbriel' &&
        (
          github.event_name != 'repository_dispatch' ||
          (
            github.event.client_payload.source_repository == 'noctalia-dev/xdg-desktop-portal-umbriel' &&
            github.event.client_payload.source_ref == 'refs/heads/main'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Umbriel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PORTAL_REVISION: ${{ github.event.client_payload.source_revision }}
        run: |
          if [[ ! "$PORTAL_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid portal revision: $PORTAL_REVISION" >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Update and commit portal input
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if ((attempt > 1)); then
              echo "Umbriel main advanced, recomputing from its latest commit (attempt $attempt of 3)."
              git fetch origin "$TARGET_BRANCH"
              git switch --detach FETCH_HEAD
            fi

            nix flake update xdg-desktop-portal-umbriel

            unexpected_tracked=$(git diff --name-only -- . ':(exclude)flake.lock')
            unexpected_untracked=$(git ls-files --others --exclude-standard)
            if [[ -n "$unexpected_tracked" || -n "$unexpected_untracked" ]]; then
              echo "The portal update changed files other than flake.lock:" >&2
              printf '%s\n%s\n' "$unexpected_tracked" "$unexpected_untracked" >&2
              exit 1
            fi
            jq -e '
              .nodes["xdg-desktop-portal-umbriel"].locked
              | .type == "github"
                and .owner == "noctalia-dev"
                and .repo == "xdg-desktop-portal-umbriel"
                and (.rev | test("^[0-9a-f]{40}$"))
            ' flake.lock > /dev/null
            nix flake check --no-build

            if git diff --quiet -- flake.lock; then
              echo "Portal input is already current."
              exit 0
            fi

            git add flake.lock
            git commit -m "chore(flake): update portal input"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done

          echo "Unable to push the portal input update after 3 attempts." >&2
          exit 1
