# Background work on the SoC tile's two LP-E cores, so the compute tile stays power-gated at idle; see docs/power.md,
# program step 7. CPUs 14 and 15 are the LP-E cores of the reference Arrow Lake-H 255H. systemd's own background.slice
# already sets CPUWeight=30, a third of the default.
[Slice]
AllowedCPUs=14-15
